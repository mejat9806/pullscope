name: Feature request
description: Suggest an improvement or a new feature
title: "feat: "
labels: ["enhancement"]
body:
  - type: textarea
    id: description
    attributes:
      label: Description
      description: What would you like Pullscope to do?
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: What problem does it solve?
      description: Tell us what is hard or slow today.
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives you considered
