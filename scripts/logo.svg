<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#7c3aed"/><stop offset="1" stop-color="#ec4899"/></linearGradient>
    <linearGradient id="bean" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#ffe9f5"/></linearGradient>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#3b0764" flood-opacity=".35"/></filter>
  </defs>
  <rect x="100" y="100" width="824" height="824" rx="190" fill="url(#bg)"/>
  <!-- git-branch antennae -->
  <g stroke="#fff" stroke-width="22" stroke-linecap="round" fill="none">
    <path d="M430 330 C410 250 380 220 350 190"/>
    <path d="M594 330 C614 250 650 220 690 196"/>
  </g>
  <circle cx="345" cy="180" r="36" fill="#fde047" stroke="#fff" stroke-width="14"/>
  <circle cx="698" cy="188" r="36" fill="#34d399" stroke="#fff" stroke-width="14"/>
  <!-- bean body -->
  <g filter="url(#sh)">
    <path d="M512 300 C700 300 770 440 770 600 C770 760 660 840 512 840 C364 840 254 760 254 600 C254 440 324 300 512 300Z" fill="url(#bean)"/>
  </g>
  <!-- googly eyes -->
  <circle cx="420" cy="520" r="78" fill="#fff" stroke="#3b0764" stroke-width="16"/>
  <circle cx="610" cy="505" r="92" fill="#fff" stroke="#3b0764" stroke-width="16"/>
  <circle cx="438" cy="548" r="34" fill="#1e1b4b"/>
  <circle cx="584" cy="468" r="40" fill="#1e1b4b"/>
  <circle cx="450" cy="538" r="10" fill="#fff"/><circle cx="598" cy="456" r="12" fill="#fff"/>
  <!-- eyebrow, one raised -->
  <path d="M340 430 Q420 395 490 428" stroke="#3b0764" stroke-width="18" stroke-linecap="round" fill="none"/>
  <path d="M530 380 Q620 330 700 392" stroke="#3b0764" stroke-width="18" stroke-linecap="round" fill="none"/>
  <!-- goofy grin + tongue -->
  <path d="M390 660 Q512 780 640 650" stroke="#3b0764" stroke-width="20" stroke-linecap="round" fill="#fb7185"/>
  <path d="M470 715 Q500 810 560 730 Z" fill="#f43f5e" stroke="#3b0764" stroke-width="14" stroke-linejoin="round"/>
  <!-- blush -->
  <ellipse cx="318" cy="640" rx="38" ry="22" fill="#f9a8d4" opacity=".8"/>
  <ellipse cx="706" cy="640" rx="38" ry="22" fill="#f9a8d4" opacity=".8"/>
  <!-- LGTM badge -->
  <g transform="rotate(-12 740 820)">
    <rect x="640" y="770" width="190" height="86" rx="43" fill="#22c55e" stroke="#fff" stroke-width="12"/>
    <text x="735" y="828" font-family="Helvetica, Arial, sans-serif" font-weight="900" font-size="52" fill="#fff" text-anchor="middle">LGTM</text>
  </g>
</svg>
